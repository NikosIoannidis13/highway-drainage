<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;font-family:Segoe UI,sans-serif}body{display:flex;flex-direction:column}
#status{padding:6px 10px;background:#f3f4f6;font-size:12px}#map{flex:1;min-height:120px}
</style></head><body><div id="status">Loading Google satellite imagery…</div><div id="map"></div>
<script>
let map, payload=null, raster=null, view=null;
const cameras={};
const status=document.getElementById('status');
window.gm_authFailure=()=>{status.textContent='Google rejected the API key. Check Maps JavaScript API, billing and the website restriction http://127.0.0.1:8765/*.';};
window.fitPreview=()=>{
  if(!map || !payload || !payload.bounds)return;
  const [west,south,east,north]=payload.bounds;
  map.fitBounds({west,south,east,north},35);
};
window.resetPreview=()=>{if(map){map.setHeading(0);map.setTilt(0);window.fitPreview();}};
window.updatePreview=(next)=>{
  if(!next)return;
  payload=next;if(!map)return;
  const changed=view!==next.view;
  if(changed && view)cameras[view]={center:map.getCenter().toJSON(),zoom:map.getZoom()};
  view=next.view;
  map.data.forEach(feature=>map.data.remove(feature));
  map.data.addGeoJson(next.geojson);
  if(raster){raster.setMap(null);raster=null;}
  if(next.image){
    const [west,south,east,north]=next.image.bounds;
    raster=new google.maps.GroundOverlay(next.image.url,{west,south,east,north},{opacity:0.55,map});
  }
  status.textContent='Google satellite imagery · '+next.geojson.features.length+' features. '+next.diagnostic;
  if(changed){if(cameras[view]){map.setCenter(cameras[view].center);map.setZoom(cameras[view].zoom);}else window.fitPreview();}
};
window.initMap=()=>{
  map=new google.maps.Map(document.getElementById('map'),{
    center:{lat:38,lng:24},zoom:7,mapTypeId:'satellite',tilt:0,gestureHandling:'greedy',
    streetViewControl:false,mapTypeControl:false,fullscreenControl:false
  });
  const colors={highway:'#1768ac',culvert:'#d97706',crossing:'#dc2626',outlet:'#16a34a',catchment:'#7c3aed'};
  map.data.setStyle(feature=>{
    const kind=feature.getProperty('kind'),color=colors[kind]||'#ffffff';
    return {strokeColor:color,strokeWeight:2,fillColor:color,fillOpacity:0.18,
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:kind==='outlet'?6:4,
        strokeColor:color,strokeWeight:2,fillColor:color,fillOpacity:kind==='outlet'?0:1},
      zIndex:kind==='catchment'?1:3};
  });
  const info=new google.maps.InfoWindow();
  map.data.addListener('click',event=>{
    const text=document.createElement('span');text.textContent=event.feature.getProperty('name');
    info.setContent(text);info.setPosition(event.latLng);info.open({map});
  });
  status.textContent='Google satellite imagery ready. Load project data to see overlays.';
  if(payload)window.updatePreview(payload);
};
setTimeout(()=>{if(!map)status.textContent='Imagery has not loaded. Check internet access, API key, Maps JavaScript API and billing.';},20000);
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=__API_KEY__&amp;loading=async&amp;callback=initMap&amp;v=quarterly"
onerror="document.getElementById('status').textContent='Cannot reach Google Maps. Check your internet connection.'"></script>
</body></html>
